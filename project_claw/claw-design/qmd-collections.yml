# qmd collection config for llm-do
# Setup: cp project_claw/claw-design/qmd-collections.yml ~/.config/qmd/llm-do.yml
# Usage: qmd --index llm-do query "..."
collections:
  docs:
    path: /home/zby/llm/llm-do/docs
    pattern: "*.md"
  notes:
    path: /home/zby/llm/llm-do/project_claw/notes
    pattern: "**/*.md"
  adr:
    path: /home/zby/llm/llm-do/project_claw/adr
    pattern: "**/*.md"
  claw-design:
    path: /home/zby/llm/llm-do/project_claw/claw-design
    pattern: "**/*.md"
  sources:
    path: /home/zby/llm/llm-do/project_claw/sources
    pattern: "**/*.md"
  tasks-active:
    path: /home/zby/llm/llm-do/project_claw/tasks/active
    pattern: "**/*.md"
  tasks-backlog:
    path: /home/zby/llm/llm-do/project_claw/tasks/backlog
    pattern: "**/*.md"
  tasks-recurring:
    path: /home/zby/llm/llm-do/project_claw/tasks/recurring
    pattern: "**/*.md"
  code-reviews:
    path: /home/zby/llm/llm-do/project_claw/code-reviews
    pattern: "**/*.md"
  skills:
    path: /home/zby/llm/llm-do/project_claw/skills
    pattern: "**/*.md"
